<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Codex Visuals · 优雅版（D+A+B）</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
        }

        #codex-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 5px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
            margin-bottom: 0.5rem;
        }

        p {
            opacity: 0.55;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <canvas id="codex-canvas"></canvas>

    <div class="content">
        <h1>CODEX VISUALS</h1>
        <p>优雅版 · 缓动 + 双波回声 + 字符调色盘</p>
    </div>

    <script>
        const canvas = document.getElementById('codex-canvas');
        const ctx = canvas.getContext('2d');

        // ========== 配置 ==========

        // 全局
        const config = {
            gridSize: 10       // 网格密度（越小越密集）
        };

        // D. 字符调色盘：块字符密度渐变（老派终端/BBS 硬核感）
        // Unicode 原生只有 3 档完整 shade，补一个极小点做最暗档
        const GLYPHS = ['·', '░', '▒', '▓', '█'];

        // 鼠标尾迹（独立可调）
        const trailConfig = {
            brushRadius: 54,
            decayRate: 0.2,
            maxEnergy: 100
        };

        // 点击涟漪（独立可调）
        const rippleConfig = {
            maxRadius: 200,        // 最大扩散半径
            expandFrames: 42,      // 扩散经过的帧数（~700ms 单向，整体 1.4s）
            ringWidth: 8,         // 环带宽度
            decayRate: 0.55,       // 拖尾衰减速度（越小尾迹越长越柔）
            maxEnergy: 100,        // 能量上限
            innerFill: 0.22,        // 圆盘内部填充强度（0=空心，1=实心）
            // B. 双波回声参数
            echoDelay: 7,          // 余震延迟（帧）
            echoStrength: 0.45,    // 余震能量占比
            echoRadiusMul: 0.62,   // 余震最大半径相对主波的倍数
            // E. 角度扰动：多谐波叠加，打破圆形的 N 重对称
            // 总振幅 × 每个谐波的 amp 相加 ≈ 实际扰动上限（px）
            wobbleAmp: 6,
            wobbleHarmonics: [
                // 低频：决定大致的不规则形状，慢速漂移
                { freq: 3, amp: 0.55, spin: 0.013 },
                // 中频：加次级凹凸，中速漂移
                { freq: 5, amp: 0.30, spin: 0.019 },
                // 高频：细小皱褶，快速漂移
                { freq: 8, amp: 0.22, spin: 0.031 }
                // 三个 spin 用互不整除的值，让复合图案永不重复
            ],
            // E+. 脉搏：整体扰动振幅按慢节奏呼吸，给涟漪一种"吸气-呼气"的生命感
            wobblePulseDepth: 0.4,  // 0=无脉搏；0.4=振幅在基线的 60%-140% 之间呼吸
            wobblePulseRate: 0.003,  // 角速率（rad/ms），0.003 ≈ 2.1s 一个呼吸周期
            // F. 涟漪间相互扰动（多涟漪同时存在时互相"感知"变形）
            interactStrength: 30,   // px，正数=相互吸引/外突，负数=相互排斥/内凹，0=关闭
            interactRange: 420,     // px，超过此距离的涟漪不影响本涟漪
            interactFalloffPow: 2,  // 衰减曲线幂次（1=线性，2=二次方，越大近距离效应越悬殊）
            // F++. 轨道漂移：涟漪中心受对方切向力影响，绕彼此公转
            orbitalSpeed: 1.2,      // px/帧，最近距离时的切向漂移速度（0=关闭，负值反向旋转）
            // G. 交汇场叠加：多涟漪覆盖同一格点时能量叠加，形成明亮的"合流热点"
            mergeBoost: 0.9,             // 超额能量的放大倍数（0=完全不叠加，1=线性叠加）
            mergeTint: [255, 205, 115]   // 热点色（琥珀/金），超额越高越偏向此色
        };
        const ripples = [];

        // ========== 状态 ==========

        let width, height, rows, cols;
        let grid = [];
        let mouse = { x: -1000, y: -1000, lastX: -1000, lastY: -1000 };

        // ========== 工具 ==========

        // A. 缓动函数：easeOut quadratic，起步快、末端缓
        function easeOut(t) {
            return 1 - (1 - t) * (1 - t);
        }

        // 点到线段最短距离（鼠标快移时保证尾迹连续）
        function distToSegment(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
        }

        // ========== 初始化 ==========

        function initGrid() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            cols = Math.ceil(width / config.gridSize);
            rows = Math.ceil(height / config.gridSize);
            grid = [];

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    grid.push({
                        x: i * config.gridSize + config.gridSize / 2,
                        y: j * config.gridSize + config.gridSize / 2,
                        trailEnergy: 0,
                        rippleEnergy: 0,   // 保留（take-max + 衰减 → 拖尾）
                        mergeEnergy: 0     // 本帧所有涟漪 power 的累加（不衰减，每帧重置）
                    });
                }
            }
        }

        // ========== 事件 ==========

        window.addEventListener('mousemove', (e) => {
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            grid.forEach(p => {
                const dist = distToSegment(p.x, p.y, mouse.lastX, mouse.lastY, mouse.x, mouse.y);
                if (dist < trailConfig.brushRadius) {
                    const power = (1 - dist / trailConfig.brushRadius) * trailConfig.maxEnergy;
                    if (power > p.trailEnergy) p.trailEnergy = power;
                }
            });
        });

        // B. 点击一次 → 主波 + 延迟余震
        window.addEventListener('click', (e) => {
            // 每个谐波一个独立随机相位，让形状每次都不一样
            const makePhases = () => rippleConfig.wobbleHarmonics.map(() => Math.random() * Math.PI * 2);
            // 主波：全强度、全半径，立即发出
            ripples.push({
                x: e.clientX, y: e.clientY,
                progress: 0, dir: 1, delay: 0,
                strength: 1.0, radiusMul: 1.0,
                wobblePhases: makePhases()
            });
            // 回声：延迟 echoDelay 帧后发出，能量和半径都更小
            // 独立的 wobblePhases，让两波扰动完全互不相关
            ripples.push({
                x: e.clientX, y: e.clientY,
                progress: 0, dir: 1, delay: rippleConfig.echoDelay,
                strength: rippleConfig.echoStrength,
                radiusMul: rippleConfig.echoRadiusMul,
                wobblePhases: makePhases()
            });
        });

        window.addEventListener('resize', initGrid);

        // ========== 渲染主循环 ==========

        function render() {
            ctx.clearRect(0, 0, width, height);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${config.gridSize * 0.75}px "JetBrains Mono", Consolas, monospace`;

            const progressStep = 1 / rippleConfig.expandFrames;

            // 1. 更新涟漪，把能量注入网格
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];

                // 延迟期（用于余震）
                if (r.delay > 0) { r.delay--; continue; }

                // A. 推进 progress（线性），用 easeOut 映射到 radius（非线性）
                r.progress += progressStep * r.dir;
                if (r.dir === 1 && r.progress >= 1) {
                    r.progress = 1;
                    r.dir = -1;
                }
                if (r.dir === -1 && r.progress <= 0) {
                    ripples.splice(i, 1);
                    continue;
                }

                // F++. 轨道漂移：受其他涟漪的"切向力"影响，中心绕彼此公转
                // 每对 (r, other) 贡献一个垂直于中心连线的推力，最终形成环绕运动
                const orbitalSpeed = rippleConfig.orbitalSpeed;
                if (orbitalSpeed !== 0) {
                    for (let oi = 0; oi < ripples.length; oi++) {
                        const other = ripples[oi];
                        if (other === r || other.delay > 0) continue;
                        const bx = other.x - r.x;
                        const by = other.y - r.y;
                        const oDist = Math.sqrt(bx * bx + by * by);
                        if (oDist === 0 || oDist > rippleConfig.interactRange) continue;
                        // 切向方向：将指向对方的向量 (bx, by) 逆时针旋转 90° → (-by, bx)
                        const invDist = 1 / oDist;
                        const tx = -by * invDist;
                        const ty = bx * invDist;
                        // 距离越近力越大；对方 strength 加权（弱涟漪推力小）
                        const falloff = 1 - oDist / rippleConfig.interactRange;
                        const push = orbitalSpeed * falloff * other.strength;
                        r.x += tx * push;
                        r.y += ty * push;
                    }
                }

                const effMax = rippleConfig.maxRadius * r.radiusMul;
                const radius = effMax * easeOut(r.progress);
                // 寿命权重：扩散阶段满强度，收缩阶段随 progress 从 1 衰减到 0
                // 这是"逐渐消散"的关键——环越缩越暗，而不是缩到最后一刻才消失
                const lifeRatio = r.dir === 1 ? 1 : r.progress;
                const peakEnergy = rippleConfig.maxEnergy * r.strength * lifeRatio;

                // E. 各谐波相位独立漂移（不同速率 → 复合图案永不重复）
                const harmonics = rippleConfig.wobbleHarmonics;
                const H = harmonics.length;
                for (let h = 0; h < H; h++) {
                    r.wobblePhases[h] += harmonics[h].spin;
                }
                // E+. 脉搏：整体扰动振幅按正弦呼吸（全场景共享同一节奏，保持和谐）
                const pulse = 1 + rippleConfig.wobblePulseDepth
                    * Math.sin(performance.now() * rippleConfig.wobblePulseRate);
                const wobbleAmp = rippleConfig.wobbleAmp * pulse;
                // 各谐波 amp 理论峰值之和（保守的扫描扩展量）
                let ampSum = 0;
                for (let h = 0; h < H; h++) ampSum += harmonics[h].amp;
                // 用 1+pulseDepth 做上限，避免扫描范围在呼气阶段漏掉外扩点
                const maxWobble = rippleConfig.wobbleAmp * (1 + rippleConfig.wobblePulseDepth) * ampSum;

                // F. 预计算本涟漪与所有其他活动涟漪的"拉扯向量"
                // 每对 (r, other) 只计算一次方向与距离，避免在 grid.forEach 里重复求
                const interactions = [];
                const iStrength = rippleConfig.interactStrength;
                const iRange = rippleConfig.interactRange;
                if (iStrength !== 0) {
                    for (let oi = 0; oi < ripples.length; oi++) {
                        const other = ripples[oi];
                        if (other === r || other.delay > 0) continue;
                        const bx = other.x - r.x;
                        const by = other.y - r.y;
                        const oDist = Math.sqrt(bx * bx + by * by);
                        if (oDist === 0 || oDist > iRange) continue;
                        const oAngle = Math.atan2(by, bx);
                        // 非线性衰减（幂次可调）+ 对方 strength 加权
                        const falloff = Math.pow(1 - oDist / iRange, rippleConfig.interactFalloffPow);
                        const contribution = falloff * iStrength * other.strength;
                        interactions.push({ oAngle, contribution });
                    }
                }
                const maxInteract = Math.abs(iStrength) * interactions.length;
                const maxDistort = maxWobble + maxInteract;

                // 扫描范围：多留 maxDistort（扰动+相互拉扯）的余量
                const useFill = rippleConfig.innerFill > 0;
                const rMin = radius - rippleConfig.ringWidth - maxDistort;
                const rMax = radius + rippleConfig.ringWidth + maxDistort;
                const rMinSq = useFill ? 0 : (rMin > 0 ? rMin * rMin : 0);
                const rMaxSq = rMax * rMax;

                grid.forEach(p => {
                    const dx = p.x - r.x;
                    const dy = p.y - r.y;
                    const dSq = dx * dx + dy * dy;
                    if (dSq < rMinSq || dSq > rMaxSq) return;
                    const d = Math.sqrt(dSq);

                    // E. 多谐波叠加：wobble = Σ amp_i · sin(freq_i·θ + phase_i)
                    const angle = Math.atan2(dy, dx);
                    let wobble = 0;
                    for (let h = 0; h < H; h++) {
                        const hm = harmonics[h];
                        wobble += Math.sin(angle * hm.freq + r.wobblePhases[h]) * hm.amp;
                    }
                    wobble *= wobbleAmp;

                    // F. 相互扰动：面向其他涟漪那侧的 effRadius 被拉扯
                    // cos(angle - oAngle) ∈ [-1, 1]，正面 1，背面 -1，只有正面受推拉
                    let interactBias = 0;
                    for (let ii = 0; ii < interactions.length; ii++) {
                        const it = interactions[ii];
                        interactBias += Math.cos(angle - it.oAngle) * it.contribution;
                    }
                    const effRadius = Math.max(0, radius + wobble + interactBias);

                    let power;
                    if (d >= effRadius) {
                        // 外缘：从峰值线性衰减到 0
                        const delta = d - effRadius;
                        if (delta >= rippleConfig.ringWidth) return;
                        power = (1 - delta / rippleConfig.ringWidth) * peakEnergy;
                    } else {
                        // 内部：在 [innerFill, 1] 之间线性过渡，中心不塌陷
                        const tInner = effRadius > 0 ? 1 - (effRadius - d) / effRadius : 0;
                        power = (rippleConfig.innerFill
                            + (1 - rippleConfig.innerFill) * tInner) * peakEnergy;
                    }
                    if (power > p.rippleEnergy) p.rippleEnergy = power;
                    // G. 累加本帧所有涟漪的 power —— 用于检测合流热点
                    p.mergeEnergy += power;
                });
            }

            // 2. 网格能量衰减 + 渲染
            const tintR = rippleConfig.mergeTint[0];
            const tintG = rippleConfig.mergeTint[1];
            const tintB = rippleConfig.mergeTint[2];
            const mergeBoost = rippleConfig.mergeBoost;
            grid.forEach(p => {
                // 两条通道独立衰减
                if (p.trailEnergy > 0) {
                    p.trailEnergy -= trailConfig.decayRate;
                    if (p.trailEnergy < 0) p.trailEnergy = 0;
                }
                if (p.rippleEnergy > 0) {
                    p.rippleEnergy -= rippleConfig.decayRate;
                    if (p.rippleEnergy < 0) p.rippleEnergy = 0;
                }

                // G. 合流热点：本帧累加能量超出单涟漪最大值的部分 = "交汇的额外能量"
                const excess = p.mergeEnergy - p.rippleEnergy;
                const heat = excess > 0 ? (excess / rippleConfig.maxEnergy) * mergeBoost : 0;
                // 重置本帧累加器，准备下一帧
                p.mergeEnergy = 0;

                // 归一化：涟漪通道叠加 heat 作为亮度加成；鼠标尾迹保持独立
                const trailB = p.trailEnergy / trailConfig.maxEnergy;
                const ringRawB = p.rippleEnergy / rippleConfig.maxEnergy + heat;
                const brightness = Math.min(1, trailB > ringRawB ? trailB : ringRawB);
                if (brightness <= 0) return;

                // D. 按亮度在调色盘里取 glyph
                const gi = Math.min(
                    GLYPHS.length - 1,
                    Math.max(0, Math.floor(brightness * GLYPHS.length))
                );
                const char = GLYPHS[gi];

                // 连续灰度 + gamma 调色
                const shade = Math.round(90 + Math.pow(brightness, 0.85) * 165);  // 90..255
                const alpha = Math.pow(brightness, 0.9);

                // G. 合流染色：heat 越大，颜色越偏向 mergeTint（琥珀金），营造热点感
                // 只有涟漪通道贡献 heat；尾迹通道不参与染色（tint 权重受 ringRawB 影响）
                const tintMix = Math.min(1, heat);
                if (tintMix > 0) {
                    const chR = Math.round(shade + (tintR - shade) * tintMix);
                    const chG = Math.round(shade + (tintG - shade) * tintMix);
                    const chB = Math.round(shade + (tintB - shade) * tintMix);
                    ctx.fillStyle = `rgba(${chR}, ${chG}, ${chB}, ${alpha})`;
                } else {
                    ctx.fillStyle = `rgba(${shade}, ${shade}, ${shade}, ${alpha})`;
                }
                ctx.fillText(char, p.x, p.y);
            });

            requestAnimationFrame(render);
        }

        initGrid();
        render();
    </script>
</body>

</html>
