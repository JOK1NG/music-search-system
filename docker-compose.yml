version: '3.8'

services:
  music-search:
    build: .
    container_name: music_search_system
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./music_hash.db:/app/music_hash.db
      - ./music_hash.index:/app/music_hash.index
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      music-search:
        condition: service_healthy
    restart: always

volumes:
  caddy_data:
  caddy_config:
